{% extends "admin/base_site.html" %}
{% block content %}
  <h2>{{ title }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Import" class="default">
  </form>

  {% if preview %}
    <h3>Preview</h3>
    <pre>{{ preview|safe }}</pre>
  {% endif %}
{% endblock %}
