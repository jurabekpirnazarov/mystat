# Monorepo deploy: backend/ va frontend/ faqat o'zgarganda alohida deploy qilinadi.
# Serverda monorepo bitta joyga clone qilingan bo'lishi kerak: $PROJECT_PATH
# (systemd va nginx yo'llarini yangilash — README.md, "Production" bo'limi)

stages:
  - test
  - deploy

variables:
  PROJECT_PATH: "/var/www/mystat"
  REPO_URL: "https://gitlab-ci-token:${CI_JOB_TOKEN}@tester.stat.uz/consalt/mystat.git"

# ---------------------------------------------------------------------------
# Tekshiruvlar (Q-06). Docker executor kerak: python/node image + postgres service.
# Faqat shell runner bo'lsa, CI/CD Variables'da CI_TESTS_DISABLED=true qo'yib vaqtincha o'chirish mumkin.
# Test yiqilsa, deploy ishga tushmaydi (needs).
# ---------------------------------------------------------------------------
.tests_rules: &tests_rules
  - if: '$CI_TESTS_DISABLED == "true"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "main"'

test-backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:14
      alias: postgres
  variables:
    POSTGRES_DB: consult_ci
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    DJANGO_SETTINGS_MODULE: core.settings.develop
    DB_ENGINE: django.db.backends.postgresql
    DB_NAME: consult_ci
    DB_USER: ci
    DB_PASSWORD: ci
    DB_HOST: postgres
    DB_PORT: "5432"
    SECRET_KEY: ci-only-not-secret
    # settings PROVIDERS Click kalitlarini default'siz o'qiydi
    CLICK_URL: https://example.invalid
    MERCHANT_ID: "0"
    MERCHANT_SERVICE_ID: "0"
    MERCHANT_USER_ID: "0"
    CLICK_SECRET_KEY: ci
    RETURN_URL: https://example.invalid
  rules: *tests_rules
  script:
    - cd backend
    - pip install -q -r requirements/develop.txt
    - mkdir -p logs
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py test --noinput

test-frontend:
  stage: test
  image: node:20
  rules: *tests_rules
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run typecheck
    - npx eslint src
    - npx vite build

.update_repo: &update_repo
  - cd $PROJECT_PATH
  - git remote set-url origin "$REPO_URL"
  - git fetch origin main
  - git reset --hard origin/main
  # .env, venv, media, node_modules va _archive saqlanib qoladi
  - git clean -fd -e .env -e venv -e media -e node_modules -e _archive

deploy-backend:
  stage: deploy
  needs:
    - job: test-backend
      optional: true
  resource_group: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - echo "🚀 Backend deploy..."
    - *update_repo
    - cd backend
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/prod.txt
    - mkdir -p logs
    - python manage.py migrate --noinput
    - python manage.py collectstatic --noinput --clear
    - sudo systemctl restart apiconsult
    - sudo systemctl restart consultbot
    - sudo systemctl restart nginx
    - echo "✅ Backend deploy tugadi"
  environment:
    name: production

deploy-frontend:
  stage: deploy
  needs:
    - job: test-frontend
      optional: true
  resource_group: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
  script:
    - echo "🚀 Frontend deploy..."
    - *update_repo
    - cd frontend
    - npm install --legacy-peer-deps
    - npm run build
    - sudo systemctl restart nginx
    - echo "✅ Frontend deploy tugadi"
  environment:
    name: production
